<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithms MCQ Quiz</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            width: 100%;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.15);
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            font-size: 1.6em;
            margin-top: 0;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 25px;
            font-size: 0.95em;
        }

        /* Progress */
        .progress-container {
            background: #e5e7eb;
            border-radius: 20px;
            height: 14px;
            margin: 15px 0;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #a78bfa);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 20px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: var(--muted);
            margin-bottom: 10px;
            font-size: 0.95em;
        }
        .answered-count {
            color: var(--success);
        }

        .section-tag {
            display: inline-block;
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            color: var(--primary-dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 18px;
            font-weight: bold;
        }

        .q-text {
            font-weight: 600;
            font-size: 1.2em;
            margin-bottom: 25px;
            color: var(--text);
        }
        .q-text code {
            display: block;
            background: #1e293b;
            color: #a5f3fc;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9em;
            margin-top: 12px;
            direction: ltr;
            text-align: left;
            white-space: pre;
            font-family: 'Courier New', monospace;
            overflow-x: auto;
        }

        .options label {
            display: block;
            margin: 10px 0;
            cursor: pointer;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            transition: all 0.2s;
            font-size: 1.05em;
            position: relative;
        }
        .options label:hover {
            border-color: var(--primary);
            background-color: #f5f3ff;
            transform: translateX(-3px);
        }
        .options input[type="radio"] { display: none; }
        .options label.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, #eef2ff, #ede9fe);
            font-weight: bold;
            color: var(--primary-dark);
        }
        .options label.selected::after {
            content: "✓";
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--success);
            font-weight: bold;
            font-size: 1.3em;
        }

        /* Navigation */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 12px;
        }
        .btn {
            padding: 13px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
        }
        .btn-prev {
            background: #e5e7eb;
            color: #374151;
        }
        .btn-prev:hover:not(:disabled) { background: #d1d5db; }
        .btn-prev:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-next {
            background: var(--primary);
            color: white;
        }
        .btn-next:hover { background: var(--primary-dark); }

        .btn-submit {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            font-size: 1.1em;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16,185,129,0.3); }

        /* Question Navigator (Mini Grid) */
        .navigator {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #e5e7eb;
        }
        .navigator-title {
            font-weight: bold;
            color: var(--muted);
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            gap: 6px;
        }
        .nav-cell {
            aspect-ratio: 1;
            background: #f1f5f9;
            color: var(--muted);
            border: 2px solid transparent;
            border-radius: 6px;
            font-size: 0.8em;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-cell:hover { transform: scale(1.1); }
        .nav-cell.answered { background: #d1fae5; color: #065f46; }
        .nav-cell.current { border-color: var(--primary); background: var(--primary); color: white; }

        /* Results */
        #results { display: none; }
        .score-board {
            text-align: center;
            padding: 35px;
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            border-radius: 16px;
            margin-bottom: 30px;
        }
        .score-number {
            font-size: 4em;
            font-weight: bold;
            background: linear-gradient(90deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }
        .score-percentage {
            font-size: 1.3em;
            color: #cbd5e1;
        }
        .grade-emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .results-summary {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .summary-card {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }
        .summary-correct {
            background: #d1fae5;
            color: #065f46;
        }
        .summary-wrong {
            background: #fee2e2;
            color: #991b1b;
        }
        .summary-skip {
            background: #fef3c7;
            color: #92400e;
        }
        .summary-card .num {
            font-size: 2em;
            display: block;
        }

        .wrong-item {
            background-color: #fef2f2;
            border-right: 5px solid var(--danger);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }
        .wrong-title { color: var(--danger); font-weight: bold; margin-bottom: 8px; font-size: 1.05em; }
        .correct-ans { color: var(--success); font-weight: bold; }
        .user-ans { color: var(--danger); text-decoration: line-through; }

        .restart-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 25px;
            font-weight: bold;
        }
        .restart-btn:hover { background: var(--primary-dark); }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 1.3em; }
            .q-text { font-size: 1.05em; }
            .options label { padding: 12px; font-size: 1em; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧠 Algorithms MCQ Quiz</h1>
    <p class="subtitle">اختاري الإجابة وسيتم الانتقال تلقائياً للسؤال التالي</p>

    <!-- Quiz Area -->
    <div id="quiz-area">
        <div class="progress-info">
            <span id="progress-text">السؤال 1 من 124</span>
            <span class="answered-count" id="answered-count">تم الإجابة: 0</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="section-tag" id="section-tag"></div>
        <div class="q-text" id="question-text"></div>
        <div class="options" id="options-area"></div>

        <div class="nav-buttons">
            <button class="btn btn-prev" id="prev-btn" onclick="prevQuestion()">⬅ السابق</button>
            <button class="btn btn-next" id="next-btn" onclick="nextQuestion()">التالي ➡</button>
            <button class="btn btn-submit" id="submit-btn" onclick="submitQuiz()" style="display:none;">🎯 إنهاء الاختبار</button>
        </div>

        <!-- Question Navigator -->
        <div class="navigator">
            <div class="navigator-title">📍 التنقل السريع بين الأسئلة:</div>
            <div class="nav-grid" id="nav-grid"></div>
        </div>
    </div>

    <!-- Results Area -->
    <div id="results">
        <div class="score-board">
            <div class="grade-emoji" id="grade-emoji">🎉</div>
            <h2 style="margin:5px 0;">نتيجتك النهائية</h2>
            <div class="score-number" id="final-score">0 / 0</div>
            <p class="score-percentage" id="score-percentage"></p>
        </div>

        <div class="results-summary">
            <div class="summary-card summary-correct">
                <span class="num" id="correct-num">0</span>
                صحيح ✓
            </div>
            <div class="summary-card summary-wrong">
                <span class="num" id="wrong-num">0</span>
                خطأ ✗
            </div>
            <div class="summary-card summary-skip">
                <span class="num" id="skip-num">0</span>
                لم يُجَب
            </div>
        </div>

        <h2 style="color: var(--danger);">📝 مراجعة الأخطاء:</h2>
        <div id="wrong-answers-list"></div>
        <p id="perfect-msg" style="display:none; text-align:center; color:var(--success); font-size:1.4em; font-weight:bold; padding:20px;">
            🎉 أحسنت! كل إجاباتك صحيحة!
        </p>
        <button class="restart-btn" onclick="location.reload()">🔄 إعادة الاختبار</button>
    </div>
</div>

    // ---------------- منطق العمل ----------------
    let currentIndex = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    const sectionTag = document.getElementById('section-tag');
    const questionText = document.getElementById('question-text');
    const optionsArea = document.getElementById('options-area');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const answeredCount = document.getElementById('answered-count');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const submitBtn = document.getElementById('submit-btn');
    const navGrid = document.getElementById('nav-grid');

    function buildNavigator() {
        navGrid.innerHTML = '';
        quizData.forEach((_, i) => {
            const cell = document.createElement('div');
            cell.className = 'nav-cell';
            cell.innerText = i + 1;
            cell.onclick = () => { currentIndex = i; loadQuestion(); };
            navGrid.appendChild(cell);
        });
    }

    function updateNavigator() {
        const cells = navGrid.querySelectorAll('.nav-cell');
        cells.forEach((cell, i) => {
            cell.classList.remove('current', 'answered');
            if (userAnswers[i] !== null) cell.classList.add('answered');
            if (i === currentIndex) cell.classList.add('current');
        });
    }

    function updateAnsweredCount() {
        const count = userAnswers.filter(a => a !== null).length;
        answeredCount.innerText = `تم الإجابة: ${count} / ${quizData.length}`;
    }

    function loadQuestion() {
        const item = quizData[currentIndex];

        progressText.innerText = `السؤال ${currentIndex + 1} من ${quizData.length}`;
        progressBar.style.width = ((currentIndex + 1) / quizData.length * 100) + "%";

        sectionTag.innerText = item.section;
        questionText.innerHTML = `<strong>Q${currentIndex + 1}:</strong> ${item.q}`;

        optionsArea.innerHTML = '';
        item.options.forEach((opt, i) => {
            const letter = String.fromCharCode(97 + i);
            const isChecked = userAnswers[currentIndex] === letter;
            const label = document.createElement('label');
            label.className = isChecked ? 'selected' : '';
            label.innerHTML = `<input type="radio" name="opt" value="${letter}" ${isChecked ? 'checked' : ''}>
                               <span>${String.fromCharCode(65 + i)}) ${opt}</span>`;
            
            label.querySelector('input').addEventListener('change', () => {
                userAnswers[currentIndex] = letter;
                updateAnsweredCount();
                updateNavigator();
                
                // Auto-jump to next question
                setTimeout(() => {
                    if (currentIndex < quizData.length - 1) {
                        currentIndex++;
                        loadQuestion();
                    } else {
                        loadQuestion(); // Refresh to show submit button
                    }
                }, 300);
            });
            optionsArea.appendChild(label);
        });

        // Buttons State
        prevBtn.disabled = (currentIndex === 0);
        
        if (currentIndex === quizData.length - 1) {
            nextBtn.style.display = 'none';
            submitBtn.style.display = 'block';
        } else {
            nextBtn.style.display = 'block';
            submitBtn.style.display = 'none';
        }

        updateNavigator();
        updateAnsweredCount();
    }

    function nextQuestion() {
        if (currentIndex < quizData.length - 1) {
            currentIndex++;
            loadQuestion();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion();
        }
    }

    function submitQuiz() {
        const unanswered = userAnswers.filter(a => a === null).length;
        if (unanswered > 0) {
            if (!confirm(`لديك ${unanswered} سؤال لم تتم الإجابة عليه. هل تريدي إنهاء الاختبار الآن؟`)) {
                return;
            }
        }

        let score = 0;
        let wrongAnswers = [];
        let skipped = 0;

        quizData.forEach((item, index) => {
            if (userAnswers[index] === null) {
                skipped++;
                wrongAnswers.push({
                    num: index + 1,
                    section: item.section,
                    q: item.q,
                    userAns: "⚠️ لم تتم الإجابة",
                    correctAns: item.answer.toUpperCase(),
                    correctText: item.options[item.answer.charCodeAt(0) - 97]
                });
            } else if (userAnswers[index] === item.answer) {
                score++;
            } else {
                wrongAnswers.push({
                    num: index + 1,
                    section: item.section,
                    q: item.q,
                    userAns: userAnswers[index].toUpperCase() + ") " + item.options[userAnswers[index].charCodeAt(0) - 97],
                    correctAns: item.answer.toUpperCase() + ") " + item.options[item.answer.charCodeAt(0) - 97]
                });
            }
        });

        const wrongCount = quizData.length - score - skipped;
        const percentage = ((score / quizData.length) * 100).toFixed(1);

        // Grade emoji
        let emoji = '😢';
        if (percentage >= 90) emoji = '🏆';
        else if (percentage >= 75) emoji = '🎉';
        else if (percentage >= 60) emoji = '👍';
        else if (percentage >= 50) emoji = '😊';

        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        document.getElementById('grade-emoji').innerText = emoji;
        document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;
        document.getElementById('score-percentage').innerText = `النسبة المئوية: ${percentage}%`;
        
        document.getElementById('correct-num').innerText = score;
        document.getElementById('wrong-num').innerText = wrongCount;
        document.getElementById('skip-num').innerText = skipped;

        const wrongList = document.getElementById('wrong-answers-list');
        wrongList.innerHTML = '';

        if (wrongAnswers.length === 0) {
            document.getElementById('perfect-msg').style.display = 'block';
        } else {
            wrongAnswers.forEach(w => {
                const div = document.createElement('div');
                div.className = 'wrong-item';
                div.innerHTML = `
                    <div class="wrong-title">❌ السؤال ${w.num} - ${w.section}</div>
                    <div style="margin-bottom:10px;">${w.q}</div>
                    <div>
                        <span class="user-ans">إجابتك: ${w.userAns}</span><br>
                        <span class="correct-ans">✓ الإجابة الصحيحة: ${w.correctAns}</span>
                    </div>`;
                wrongList.appendChild(div);
            });
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize
    buildNavigator();
    loadQuestion();
</script>
